name: DRF CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pypoetry
            .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-
      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Run migrate
        run: poetry run python manage.py migrate

      - name: Run tests
        env:
        run: poetry run python manage.py test

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Log in in Docker hub
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }} .

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}


  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@0.8.1
        with:
          ssh_private_key: ${{ secrets.SSH_KEY }}

      - name: Copy project files to server
        run: |
          rsync -avz --exclude='__pycache__' --exclude='.venv' --exclude='.git' \
          . ${SSH_USER_WORKING_WITH_DJANGO_2}@${SERVER_ID_WORKING_WITH_DJANGO_2}:${DEPLOY_DIR}
        env:
          SSH_USER_WORKING_WITH_DJANGO_2: ${{ secrets.SSH_USER }}
          SERVER_ID_WORKING_WITH_DJANGO_2: ${{ secrets.SERVER_IP }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}

      - name: Install dependencies on server
        run: |
          ssh -o StrictHostKeyChecking=no ${SSH_USER_WORKING_WITH_DJANGO_2}@${SERVER_ID_WORKING_WITH_DJANGO_2} << 'EOF'
          cd ${DEPLOY_DIR}
          python3 -m pip install --upgrade pip
          python3 -m pip install poetry
          poetry install --no-dev
          EOF
        env:
          SSH_USER_WORKING_WITH_DJANGO_2: ${{ secrets.SSH_USER }}
          SERVER_ID_WORKING_WITH_DJANGO_2: ${{ secrets.SERVER_IP }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}

      - name: Apply migrations on server
        run: |
          ssh -o StrictHostKeyChecking=no ${SSH_USER_WORKING_WITH_DJANGO_2}@${SERVER_ID_WORKING_WITH_DJANGO_2} << 'EOF'
          cd ${DEPLOY_DIR}
          poetry run python manage.py migrate
          EOF
        env:
          SSH_USER_WORKING_WITH_DJANGO_2: ${{ secrets.SSH_USER }}
          SERVER_ID_WORKING_WITH_DJANGO_2: ${{ secrets.SERVER_IP }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}

      - name: Collect static files on server
        run: |
          ssh -o StrictHostKeyChecking=no ${SSH_USER_WORKING_WITH_DJANGO_2}@${SERVER_ID_WORKING_WITH_DJANGO_2} << 'EOF'
          cd ${DEPLOY_DIR}
          poetry run python manage.py collectstatic --noinput
          EOF
        env:
          SSH_USER_WORKING_WITH_DJANGO_2: ${{ secrets.SSH_USER }}
          SERVER_ID_WORKING_WITH_DJANGO_2: ${{ secrets.SERVER_IP }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}

      - name: Restart application
        run: |
          ssh -o StrictHostKeyChecking=no ${SSH_USER_WORKING_WITH_DJANGO_2}@${SERVER_ID_WORKING_WITH_DJANGO_2} << 'EOF'
          sudo systemctl restart myapp.service
          EOF
        env:
          SSH_USER_WORKING_WITH_DJANGO_2: ${{ secrets.SSH_USER }}
          SERVER_ID_WORKING_WITH_DJANGO_2: ${{ secrets.SERVER_IP }}

