name: DRF CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pypoetry
            .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi --no-root

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Create environment file
        run: |
          echo "SECRET_KEY=test-key-12345" > .env
          echo "DEBUG=True" >> .env
          echo "POSTGRES_DB=test_db" >> .env
          echo "POSTGRES_USER=postgres" >> .env
          echo "POSTGRES_PASSWORD=postgres" >> .env
          echo "POSTGRES_HOST=localhost" >> .env
          echo "POSTGRES_PORT=5432" >> .env

      - name: Run migrate
        run: poetry run python manage.py migrate

      - name: Run tests
        run: poetry run python manage.py test

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Log in in Docker hub
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }} .

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}


  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Create and deploy archive
        run: |
          # Клонируем свежую копию репозитория
          git clone https://github.com/AlenaGuseva25/working_with_django_2.git /tmp/deploy_repo

          # Создаем архив из чистой копии
          cd /tmp/deploy_repo &&
          tar --exclude='__pycache__' --exclude='.venv' --exclude='.git' -czf /tmp/deploy.tar.gz .

          # Копируем на сервер
          scp -o StrictHostKeyChecking=no /tmp/deploy.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:/tmp/

          # Распаковываем
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "
          mkdir -p ${{ secrets.DEPLOY_DIR }} &&
          cd ${{ secrets.DEPLOY_DIR }} &&
          tar -xzf /tmp/deploy.tar.gz &&
          rm /tmp/deploy.tar.gz &&
          echo 'Files deployed:' &&
          ls -la
          "

      - name: Install dependencies on server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "
          while sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
            echo 'Waiting for apt lock...'
            sleep 1
          done
          while sudo fuser /var/lib/dpkg/lock >/dev/null 2>&1; do
            echo 'Waiting for dpkg lock...'
            sleep 1
          done

          cd ${{ secrets.DEPLOY_DIR }} &&
          sudo apt-get update &&
          sudo apt-get install -y python3-pip python3-venv &&
          python3 -m venv /tmp/poetry_venv &&
          /tmp/poetry_venv/bin/pip install --upgrade pip &&
          /tmp/poetry_venv/bin/pip install poetry &&
          /tmp/poetry_venv/bin/poetry config virtualenvs.in-project true &&
          /tmp/poetry_venv/bin/poetry install --no-root
          "

      - name: Apply migrations on server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "
          cd ${{ secrets.DEPLOY_DIR }} &&
          source .venv/bin/activate &&
          python manage.py migrate --skip-checks
          "

      - name: Configure static root
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "
          cd ${{ secrets.DEPLOY_DIR }} &&
          source .venv/bin/activate &&

          # Создаем папку для статики
          mkdir -p /home/test/static

          # Добавляем STATIC_ROOT в config/settings.py
          echo '' >> config/settings.py
          echo '# Static files for production' >> config/settings.py
          echo 'STATIC_ROOT = \"/home/test/static\"' >> config/settings.py
          "

      - name: Collect static files on server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "
          cd ${{ secrets.DEPLOY_DIR }} &&
          source .venv/bin/activate &&
          python manage.py collectstatic --noinput
          "

      - name: Create systemd service file locally
        run: |
          echo "[Unit]" > myapp.service
          echo "Description=My Django Application" >> myapp.service
          echo "After=network.target" >> myapp.service
          echo "" >> myapp.service
          echo "[Service]" >> myapp.service
          echo "Type=simple" >> myapp.service
          echo "User=test" >> myapp.service
          echo "Group=test" >> myapp.service
          echo "WorkingDirectory=/home/test/myapp" >> myapp.service
          echo "Environment=PATH=/home/test/myapp/.venv/bin" >> myapp.service
          echo "ExecStart=/home/test/myapp/.venv/bin/gunicorn --workers 3 --bind 0.0.0.0:8000 config.wsgi:application" >> myapp.service
          echo "Restart=always" >> myapp.service
          echo "RestartSec=3" >> myapp.service
          echo "" >> myapp.service
          echo "[Install]" >> myapp.service
          echo "WantedBy=multi-user.target" >> myapp.service

      - name: Fix systemd service
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "
          # Удаляем старый сервис
          sudo systemctl stop myapp.service || true
          sudo systemctl disable myapp.service || true
          sudo rm -f /etc/systemd/system/myapp.service

          # Создаем новый сервис командами
          echo '[Unit]' | sudo tee -a /etc/systemd/system/myapp.service
          echo 'Description=My Django Application' | sudo tee -a /etc/systemd/system/myapp.service
          echo 'After=network.target' | sudo tee -a /etc/systemd/system/myapp.service
          echo '' | sudo tee -a /etc/systemd/system/myapp.service
          echo '[Service]' | sudo tee -a /etc/systemd/system/myapp.service
          echo 'Type=simple' | sudo tee -a /etc/systemd/system/myapp.service
          echo 'User=test' | sudo tee -a /etc/systemd/system/myapp.service
          echo 'Group=test' | sudo tee -a /etc/systemd/system/myapp.service
          echo 'WorkingDirectory=/home/test/myapp' | sudo tee -a /etc/systemd/system/myapp.service
          echo 'ExecStart=/home/test/myapp/.venv/bin/python -m gunicorn --workers 3 --bind 0.0.0.0:8000 config.wsgi:application' | sudo tee -a /etc/systemd/system/myapp.service
          echo 'Restart=always' | sudo tee -a /etc/systemd/system/myapp.service
          echo 'RestartSec=3' | sudo tee -a /etc/systemd/system/myapp.service
          echo '' | sudo tee -a /etc/systemd/system/myapp.service
          echo '[Install]' | sudo tee -a /etc/systemd/system/myapp.service
          echo 'WantedBy=multi-user.target' | sudo tee -a /etc/systemd/system/myapp.service

          sudo systemctl daemon-reload
          sudo systemctl enable myapp.service
          sudo systemctl start myapp.service
          sleep 3
          sudo systemctl status myapp.service --no-pager
          "

      - name: Check gunicorn logs
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "
          sudo journalctl -u myapp.service -n 20 --no-pager
          "    

